/* ---------- shared diagrams ---------- */
/* Centipede: side view, head at left. Spine follows a gentle travelling wave.
   opts: x,y,len,segs,t, move(0..1 leg swing), bodyR, alpha, segGlow(i)->0..1,
         legAlpha, xray (translucent body), antennaSweep (radians), legOverride(i,side)->angle */
function drawCentipede(o){
  const segs=o.segs||21, len=o.len||900, t=o.t||0;
  const pts=[];
  for(let i=0;i<segs;i++){ const u=i/(segs-1);
    const waveA=(o.waveAmp==null?10:o.waveAmp)*Math.sin(u*Math.PI*0.9);
    const y=o.y + Math.sin(u*5.2 - t*2.1)*waveA*0.35 + Math.sin(u*Math.PI)* (o.arch||0);
    pts.push({x:o.x - len/2 + u*len, y, u, r: lerp(o.headR||30, o.tailR||11, Math.pow(u,0.8))});
  }
  ctx.save(); ctx.globalAlpha*= (o.alpha==null?1:o.alpha);
  /* legs (behind body) */
  const move=o.move==null?1:o.move;
  for(let i=1;i<segs;i++){ const p=pts[i]; if(p.r<9) continue;
    for(const side of [-1,1]){
      const ph = t*7.2 - i*0.62 + (side>0?0.5:0);
      const swing = Math.sin(ph)*0.38*move;
      const hipx=p.x, hipy=p.y + p.r*0.5;
      const seg1=(o.legLen||52)*(p.r/26);
      const a1 = Math.PI/2 + side*0.55 + swing*0.6;
      const kx=hipx+Math.cos(a1)*seg1*0.62, ky=hipy+Math.sin(a1)*seg1*0.62;
      const a2 = a1 + 0.85 + swing*0.5;
      const fx=kx+Math.cos(a2)*seg1*0.75, fy=ky+Math.sin(a2)*seg1*0.75;
      ctx.strokeStyle=o.legColor||COL.centDeep; ctx.lineWidth=Math.max(3,p.r*0.30);
      ctx.lineCap='round'; ctx.globalAlpha*=(o.legAlpha==null?0.95:o.legAlpha);
      ctx.beginPath(); ctx.moveTo(hipx,hipy); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
      ctx.globalAlpha/=(o.legAlpha==null?0.95:o.legAlpha);
    }
  }
  /* body segments */
  for(let i=segs-1;i>=0;i--){ const p=pts[i];
    const glow=o.segGlow? clamp(o.segGlow(i),0,1):0;
    const g=ctx.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.35,p.r*0.2,p.x,p.y,p.r*1.25);
    if(o.xray){ g.addColorStop(0,'rgba(168,217,92,0.20)'); g.addColorStop(1,'rgba(77,158,79,0.10)'); }
    else { g.addColorStop(0, glow>0.03? COL.centGlow : COL.cent); g.addColorStop(1, glow>0.03? COL.cent : COL.centDeep); }
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*1.12,p.r,0,0,Math.PI*2); ctx.fill();
    if(o.xray){ ctx.strokeStyle='rgba(215,247,155,0.55)'; ctx.lineWidth=2; ctx.stroke(); }
    else if(glow>0.03){ ctx.strokeStyle=COL.centGlow; ctx.lineWidth=2.5; ctx.stroke(); }
  }
  /* head + antennae */
  const hp=pts[0];
  ctx.fillStyle=o.xray?'rgba(168,217,92,0.25)':COL.cent;
  ctx.beginPath(); ctx.ellipse(hp.x-hp.r*0.5,hp.y,hp.r*1.05,hp.r*0.92,0,0,Math.PI*2); ctx.fill();
  const sweep=(o.antennaSweep==null? Math.sin(t*1.7)*0.16 : o.antennaSweep);
  for(const s of [-1,1]){
    const bx=hp.x-hp.r*1.2, by=hp.y+s*hp.r*0.4;
    const a=Math.PI + s*(0.5+sweep) ;
    const mx=bx+Math.cos(a)*(o.antLen||92)*0.55, my=by+Math.sin(a)*(o.antLen||92)*0.55 + s*10;
    const tx2=bx+Math.cos(a+ s*0.22)*(o.antLen||92), ty2=by+Math.sin(a+s*0.22)*(o.antLen||92);
    ctx.strokeStyle=o.legColor||COL.centDeep; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(mx,my,tx2,ty2); ctx.stroke();
  }
  ctx.restore();
  return pts;
}
/* simple standing human; o: x (feet center), y (feet), h (height), t, zoneGlow:{head,trunk,limbs}, xray */
function drawHuman(o){
  const h=o.h||430, x=o.x, y=o.y, u=h/430;
  ctx.save(); ctx.globalAlpha*=(o.alpha==null?1:o.alpha);
  const skin=o.xray?'rgba(255,157,118,0.25)':COL.hum, edge=o.xray?'rgba(255,217,196,0.8)':COL.humDeep;
  const glowC=COL.gold;
  function part(draw, glow){ ctx.save(); if(glow>0.03){ ctx.shadowColor=glowC; ctx.shadowBlur=26*glow; } draw(); ctx.restore(); }
  const zg=o.zoneGlow||{};
  /* legs */
  part(()=>{ ctx.strokeStyle=skin; ctx.lineWidth=30*u; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-16*u,y-150*u); ctx.lineTo(x-30*u,y-8); ctx.moveTo(x+16*u,y-150*u); ctx.lineTo(x+34*u,y-8); ctx.stroke(); }, zg.limbs||0);
  /* arms */
  part(()=>{ ctx.strokeStyle=skin; ctx.lineWidth=24*u;
    ctx.beginPath(); ctx.moveTo(x-52*u,y-300*u); ctx.lineTo(x-96*u,y-168*u); ctx.moveTo(x+52*u,y-300*u); ctx.lineTo(x+98*u,y-172*u); ctx.stroke(); }, zg.limbs||0);
  /* trunk */
  part(()=>{ ctx.fillStyle=skin; rr(x-58*u,y-318*u,116*u,182*u,40*u); ctx.fill(); if(o.xray){ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();} }, zg.trunk||0);
  /* head */
  part(()=>{ ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(x,y-368*u,44*u,0,Math.PI*2); ctx.fill(); if(o.xray){ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();} }, zg.head||0);
  ctx.restore();
}

function vsTag(cx, y, leftLabel, rightLabel, alpha){

function wordTime(si, word){ const sc=TIMINGS.scenes[si]; const w=sc.words.find(w=>w.w.replace(/[.,—]/g,'')===word.replace(/[.,—]/g,'')); return w? w.start : sc.start; }
function sStart(i){ return TIMINGS.scenes[i].start; }
function sDur(i){ return TIMINGS.scenes[i].dur; }
/* caption for absolute time t */
function drawCaption(t){
  for(const s of SENTENCES){ if(t>=s.start-0.05 && t<=s.end+0.28){
    const a = ss(s.start-0.05, s.start+0.22, t) * (1-ss(s.end+0.05, s.end+0.28, t));
    ctx.save(); ctx.globalAlpha=a;
    ctx.font=`600 37px ${FONT}`;
    const maxW=1420; const words=s.text.split(' '); const lines=[]; let line='';
    for(const w of words){ const test=line? line+' '+w : w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test; }
    if(line) lines.push(line);
    const bh=lines.length*48+30, by=H-64-bh;
    ctx.fillStyle='rgba(4,16,20,0.78)'; rr(W/2-(maxW+72)/2, by, maxW+72, bh, 14); ctx.fill();
    ctx.fillStyle=COL.gold; ctx.fillRect(W/2-(maxW+72)/2, by, 6, bh);
    lines.forEach((L,i)=> txt(L, W/2, by+34+i*48, 37, COL.ink, 'center', 600, FONT));
    ctx.restore(); return;
  }}
}

function sceneAlpha(i,t){ const st=sStart(i), en=st+sDur(i); if(i===7) return ss(st-0.28,st+0.05,t); return ss(st-0.28,st+0.05,t)*(1-ss(en-0.05,en+0.28,t)); }

function drawS1(t){
  const i=0, st=sStart(i), lt=t-st;

  const ta = 1-ss(2.5,3.3,lt);
  if(ta>0){ const sc=spring(lt/0.55);
    ctx.save(); ctx.globalAlpha=ta; ctx.translate(W/2,300); ctx.scale(sc,sc); ctx.rotate(-0.012);
    txt('NOT A SMALL', 0,-58, 128, COL.ink,'center',900,FONTD);
    txt('HUMAN.', 0, 62, 128, COL.red,'center',900,FONTD);
    ctx.restore();
    txt('a completely different  BODY PLAN', W/2, 452, 36, COL.dim,'center',600,FONT, ss(0.5,1.1,lt)*ta, 2);
  }
  /* centipede runs in */
  const enter = easeInOut(clamp((lt-2.4)/2.8,0,1));
  const cx = lerp(-640, 830, enter);
  const running = lt<5.4?1:0.4;
  const pts = drawCentipede({x:cx, y:640, len:1060, segs:21, t:t*1.15, move:running, legLen:58, headR:32, tailR:12, antLen:100});
  if(enter>0.6) txt('THIS ONE — 21 PAIRS OF LEGS', cx, 830, 30, COL.cent,'center',800,FONTD, ss(0.6,0.85,enter));
  /* leg-pair counter, word-locked */
  const tF=wordTime(i,'Fifteen')-st, tT=wordTime(i,'Twenty-one')-st, tS=wordTime(i,'Sometimes')-st, tA=wordTime(i,'Always')-st;
  const cyc=[27,39,57,83,115,151,191];
  let val='— —', stepT=lt;
  if(lt>=tF && lt<tT){ val='15'; stepT=lt-tF; }
  else if(lt>=tT && lt<tS){ val='21'; stepT=lt-tT; }
  else if(lt>=tS && lt<tA){ const k=Math.min(6,Math.floor((lt-tS)/0.17)); val=String(cyc[k]); stepT=(lt-tS)-k*0.17; }
  else if(lt>=tA){ val='191'; stepT=lt-tA; }
  if(lt>tF-0.4){
    ctx.save(); ctx.globalAlpha=ss(tF-0.4,tF+0.1,lt);
    txt('LEG PAIRS', 1560, 218, 28, COL.dim,'center',700,FONTD,1,4);
    const pop=1+0.22*Math.exp(-5*Math.max(0,stepT))*Math.cos(9*Math.max(0,stepT));
    ctx.translate(1560,318); ctx.scale(pop,pop);
    txt(val, 0, 0, 120, COL.gold,'center',900,FONTD);
    ctx.restore();
    if(lt>=tA) stamp('ALWAYS ODD', 1560, 452, 44, COL.red, -0.06, ss(tA,tA+0.25,lt)*(0.75+0.25*Math.sin(t*30)*Math.exp(-(lt-tA)*2)));
  }
  /* human */
  const hu = ss(wordTime(i,'You')-st-0.1, wordTime(i,'You')-st+0.5, lt);
  if(hu>0){ drawHuman({x:1560, y:930, h:330, t, alpha:hu});
    txt('HUMAN — 1 PAIR', 1560, 528, 28, COL.hum,'center',800,FONTD,hu); }
}
function drawS2(t){

function drawS4(t){

  const cord = pts.map(p=>({x:p.x, y:p.y+p.r*0.42}));
  const dp = ss(0.7, 3.6, lt);
  ctx.save(); ctx.strokeStyle=COL.nerve; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.shadowColor=COL.nerve; ctx.shadowBlur=12;

  const total=cord.length-1, upto=dp*total, full=Math.floor(upto);
  cord.forEach((p,k)=>{ if(k===0) ctx.moveTo(p.x,p.y); else if(k<=full) ctx.lineTo(p.x,p.y); });

  drawHuman({x:1600, y:990, h:430, t, xray:true});

  ctx.save();
  ctx.fillStyle=COL.hum; ctx.shadowColor=COL.hum; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.arc(1600, 622, 26,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.strokeStyle=COL.hum; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(1600,648); ctx.lineTo(1600,838); ctx.stroke();
  const sigT = ss(st+ sDur(i)*0.60, st+sDur(i)*0.60+2.4, t);
  if(sigT>0 && sigT<1){ const sy=lerp(648,838,sigT);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(1600,sy,9,0,Math.PI*2); ctx.fill(); }
  txt('ONE BRAIN', 1600, 520, 30, COL.hum,'center',800,FONTD, ss(sDur(i)*0.55, sDur(i)*0.62, lt));
  txt('ONE CORD', 1600, 900, 26, COL.hum,'center',700,FONTD, ss(sDur(i)*0.6, sDur(i)*0.68, lt));
  txt('every order travels from the top', 1600, 1030, 25, COL.dim,'center',500,FONT, ss(sDur(i)*0.66, sDur(i)*0.74, lt));
}
function drawS5(t){
  const i=4, st=sStart(i), lt=t-st;
  figLabel('FIG. 5 — BREATHING','No lungs','air goes straight to the tissues — the blood sits this one out');
  /* centipede flank, big */
  const y=430, x0=170, x1=1180, segs=13;
  const segW=(x1-x0)/segs;
  /* leg stubs under the flank so it reads as a centipede, not beads */
  ctx.strokeStyle=COL.centDeep; ctx.lineWidth=7; ctx.lineCap='round';
  for(let k=0;k<segs;k++){ const cx=x0+segW*(k+0.5); const sw=Math.sin(t*6-k*0.6)*7;
    ctx.beginPath(); ctx.moveTo(cx-12,y+52); ctx.lineTo(cx-20+sw,y+104); ctx.moveTo(cx+14,y+52); ctx.lineTo(cx+24+sw,y+104); ctx.stroke(); }
  for(let k=segs-1;k>=0;k--){ const cx=x0+segW*(k+0.5);
    const g=ctx.createRadialGradient(cx-20,y-30,16,cx,y,110);
    g.addColorStop(0,COL.cent); g.addColorStop(1,COL.centDeep);
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,y,segW*0.56,64,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(215,247,155,0.25)'; ctx.beginPath(); ctx.ellipse(cx-14,y-26,segW*0.30,15,0,0,Math.PI*2); ctx.fill(); }
  /* tracheal tree: recursive deterministic branches from each spiracle */
  const paths=[];
  function branch(x,y,ang,len,wid,depth,out){ if(depth===0||len<7) return;
    const nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len; out.push([x,y,nx,ny,wid]);
    branch(nx,ny,ang-0.42,len*0.72,wid*0.7,depth-1,out); branch(nx,ny,ang+0.38,len*0.72,wid*0.7,depth-1,out);
    if(depth>2) branch(nx,ny,ang+0.02,len*0.66,wid*0.66,depth-1,out); }
  const spiracles=[];
  for(let k=1;k<segs;k+=2){ const sx=x0+segW*k, sy=y+64; spiracles.push({x:sx,y:sy,k});
    const segsArr=[]; branch(sx,sy, -Math.PI/2+0.25, 30, 5, 3, segsArr); paths.push(segsArr);
    ctx.fillStyle='#0a2e1a'; ctx.beginPath(); ctx.ellipse(sx,sy,11,7,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=COL.centGlow; ctx.lineWidth=2.5; ctx.stroke(); }
  const treeA = ss(1.0, 2.6, lt);
  ctx.save(); ctx.globalAlpha=treeA; ctx.strokeStyle='rgba(190,240,255,0.95)'; ctx.lineCap='round';
  paths.forEach(segsArr=> segsArr.forEach(([ax,ay,bx,by,w])=>{ ctx.lineWidth=w+1.2; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); }));
  ctx.restore();
  txt('SPIRACLES', spiracles[1].x, y+150, 26, COL.air,'center',800,FONTD, treeA);
  txt('TRACHEAE → TISSUE', 670, y+212, 32, COL.air,'center',800,FONTD, treeA);
  /* air particles flowing in (deterministic: position is a pure function of seed & t) */
  if(treeA>0.5){ const rnd=mulberry32(777);
    for(let p=0;p<84;p++){ const sd=rnd(), sp=spiracles[Math.floor(rnd()*spiracles.length)];
      const segsArr=paths[spiracles.indexOf(sp)]; if(!segsArr) continue;
      const life=((t*(0.24+sd*0.2) + sd*7)%1);
      const segIdx=Math.min(segsArr.length-1, Math.floor(life*segsArr.length));
      const [ax,ay,bx,by]=segsArr[segIdx]; const u=(life*segsArr.length)%1;
      const px=lerp(ax,bx,u), py=lerp(ay,by,u);
      ctx.fillStyle='rgba(190,240,255,'+(0.35+0.65*life)+')';
      ctx.beginPath(); ctx.arc(px,py, 4.6,0,Math.PI*2); ctx.fill(); } }
  /* tissue glow cells at branch ends */
  if(treeA>0.6){ ctx.save(); ctx.globalAlpha=(treeA-0.6)/0.4;
    paths.forEach(segsArr=>{ const e=segsArr[segsArr.length-1];
      ctx.fillStyle='rgba(215,247,155,0.20)'; ctx.beginPath(); ctx.arc(e[2],e[3],16+4*Math.sin(t*3+e[2]),0,Math.PI*2); ctx.fill(); });
    ctx.restore(); }
  /* centipede blood: pale cells drifting in a vessel BELOW, untouched */
  const vy=760;
  ctx.strokeStyle='rgba(125,138,148,0.5)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x0,vy); ctx.lineTo(x1,vy); ctx.stroke();
  for(let c=0;c<9;c++){ const px=x0 + ((c*137 + t*36)%(x1-x0));
    ctx.fillStyle=COL.bloodPale; ctx.beginPath(); ctx.ellipse(px,vy,17,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(11,33,41,0.35)'; ctx.beginPath(); ctx.ellipse(px,vy,8,5,0,0,Math.PI*2); ctx.fill(); }
  txt('ITS BLOOD CARRIES NO OXYGEN', 670, vy+64, 30, COL.bloodPale,'center',800,FONTD, ss(5.4,6.4,lt));
  /* human side: lung + blood that loads up */
  const hx=1520, hy=330;
  ctx.save();
  ctx.fillStyle='rgba(255,157,118,0.46)'; ctx.strokeStyle=COL.hum; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(hx-78,hy+120,74,118,-0.14,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx+78,hy+120,74,118,0.14,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=COL.air; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(hx,hy-96); ctx.lineTo(hx,hy+58); ctx.stroke();
  ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(hx,hy+58); ctx.lineTo(hx-66,hy+118); ctx.moveTo(hx,hy+58); ctx.lineTo(hx+66,hy+118); ctx.stroke();
  /* inhalation particles */
  for(let p=0;p<14;p++){ const u=((t*0.55 + p*0.37)%1);
    const py=lerp(hy-96,hy+58,u); ctx.fillStyle='rgba(174,231,255,0.9)';
    ctx.beginPath(); ctx.arc(hx+Math.sin(p*7)*7, py, 4,0,Math.PI*2); ctx.fill(); }
  /* vessel with cells turning red */
  const vy2=vy;
  ctx.strokeStyle='rgba(255,90,90,0.45)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(1330,vy2); ctx.lineTo(1790,vy2); ctx.stroke();
  for(let c=0;c<6;c++){ const px=1330 + ((c*97 + t*52)%460);
    const load = clamp((px-1400)/260,0,1);
    ctx.fillStyle = load>0.5? COL.blood : '#c98a7d';
    ctx.beginPath(); ctx.ellipse(px,vy2,17,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(11,33,41,0.30)'; ctx.beginPath(); ctx.ellipse(px,vy2,8,5,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
  txt('LUNGS', hx, hy-140, 30, COL.hum,'center',800,FONTD);
  txt('YOUR BLOOD CARRIES IT', 1560, vy+64, 30, COL.blood,'center',800,FONTD, ss(5.4,6.4,lt));
}
function drawS6(t){
  const i=5, st=sStart(i), lt=t-st;
  figLabel('FIG. 6 — HEART','A tube, not a pump','one vessel, pulsing the length of the body');
  const pts = drawCentipede({x:760, y:470, len:1180, segs:21, t:t*0.5, move:0.18, legLen:56, headR:34, tailR:13, antLen:96});
  /* dorsal heart tube + travelling pulse */
  const tube = pts.map(p=>({x:p.x, y:p.y-p.r*0.72}));
  ctx.save(); ctx.strokeStyle='rgba(255,90,90,0.72)'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); tube.forEach((p,k)=> k? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
  const pu = ((lt*0.9)%1+1)%1;
  const fi = pu*(tube.length-1), f0=Math.floor(fi), f1=Math.min(tube.length-1,f0+1);
  const px=lerp(tube[f0].x,tube[f1].x,fi-f0), py=lerp(tube[f0].y,tube[f1].y,fi-f0);
  ctx.fillStyle=COL.blood; ctx.shadowColor=COL.blood; ctx.shadowBlur=30;
  ctx.beginPath(); ctx.arc(px,py,15,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,90,90,0.35)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(px,py, 26+10*Math.sin(t*9),0,Math.PI*2); ctx.stroke();
  ctx.restore();
  txt('A HEART AS LONG AS THE BODY', 760, 700, 36, COL.blood,'center',900,FONTD, ss(0.7,1.5,lt));
  /* human heart */
  const hx=1560, hy=430, beat=1+0.10*Math.max(0,Math.sin(t*5.4))*Math.exp(-Math.pow((t*5.4)%(Math.PI*2)*0+ ((t*5.4)%6.283>3?0:0),2))*0 + 0.09*Math.pow(Math.max(0,Math.sin(t*5.4)),3);
  ctx.save(); ctx.translate(hx,hy); ctx.scale(beat,beat);
  ctx.fillStyle=COL.humDeep; ctx.shadowColor=COL.humDeep; ctx.shadowBlur=24;
  ctx.beginPath(); ctx.moveTo(0,86);
  ctx.bezierCurveTo(-118,-6,-74,-108,0,-44);
  ctx.bezierCurveTo(74,-108,118,-6,0,86); ctx.fill(); ctx.restore();
  ctx.strokeStyle='rgba(255,217,196,0.65)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(hx,hy-40); ctx.lineTo(hx,hy+66); ctx.moveTo(hx-66,hy+6); ctx.lineTo(hx+66,hy+6); ctx.stroke();
  const ch = Math.floor(t*2.7)%2;
  txt(ch?'1 · 2':'3 · 4', hx, hy-138, 30, COL.humSoft,'center',800,FONTD, 0.85);
  txt('ONE PUMP — 4 CHAMBERS', hx, 700, 32, COL.hum,'center',900,FONTD, ss(1.4,2.2,lt));
}
function drawS7(t){
  const i=6, st=sStart(i), lt=t-st;
  figLabel('FIG. 7 — SENSES','It feels its way','antennae first — the eyes barely matter');
  /* centipede head, left */
  const hx=592, hy=500, hr=170;
  const g1=ctx.createRadialGradient(hx-50,hy-60,40,hx,hy,240);
  g1.addColorStop(0,COL.cent); g1.addColorStop(1,COL.centDeep);
  ctx.fillStyle=g1; ctx.beginPath(); ctx.ellipse(hx,hy,hr*1.06,hr*0.92,0,0,Math.PI*2); ctx.fill();
  /* ocelli dimming */
  const dim = 1-ss(1.2,3.2,lt)*0.85;
  [[-70,-60],[-24,-82],[26,-78],[74,-54]].forEach(([dx,dy])=>{ ctx.fillStyle='#0e2c1c';
    ctx.beginPath(); ctx.arc(hx+dx,hy+dy,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(215,247,155,'+(0.75*dim)+')'; ctx.beginPath(); ctx.arc(hx+dx-3,hy+dy-3,4.5,0,Math.PI*2); ctx.fill(); });
  txt('OCELLI — SIMPLE EYESPOTS', hx, hy+hr+58, 28, COL.dim,'center',700,FONTD, ss(1.0,1.8,lt));
  /* antennae sweeping with touch rings */
  for(const s of [-1,1]){
    const sweepA = Math.sin(t*1.15 + (s>0?0.9:0))*0.5;
    const bx=hx-140, by=hy+s*78;
    const tipx=bx-330, tipy=by+s*130+Math.sin(t*1.15+(s>0?0.9:0))*66;
    ctx.strokeStyle=COL.centDeep; ctx.lineWidth=10; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.quadraticCurveTo(bx-180, by+s*120, tipx, tipy); ctx.stroke();
    ctx.fillStyle=COL.centGlow; ctx.beginPath(); ctx.arc(tipx,tipy,8,0,Math.PI*2); ctx.fill();
    for(let rI=0;rI<2;rI++){ const rp=((t*0.7 + rI*0.5 + (s>0?0.25:0))%1);
      ctx.strokeStyle='rgba(215,247,155,'+(0.5*(1-rp))+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(tipx,tipy, 12+rp*74, 0, Math.PI*2); ctx.stroke(); }
  }
  txt('ANTENNAE DO THE SENSING', hx-40, hy-hr-58, 32, COL.cent,'center',900,FONTD, ss(2.2,3.0,lt));
  /* human head profile with vision cone, right */
  const ex=1500, ey=470;
  ctx.save();
  const sweep=Math.sin(t*0.8)*0.14;
  ctx.translate(ex,ey); ctx.rotate(sweep*0.4);
  const grad=ctx.createLinearGradient(60,0,560,0);
  grad.addColorStop(0,'rgba(255,209,102,0.34)'); grad.addColorStop(1,'rgba(255,209,102,0)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.moveTo(56,-8); ctx.lineTo(560,-150); ctx.lineTo(560,150); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle=COL.hum; ctx.beginPath(); ctx.arc(ex,ey,120,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=COL.hum; rr(ex-96,ey+96,150,150,52); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex+64,ey-16,26,20,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#20303a'; ctx.beginPath(); ctx.arc(ex+72,ey-16,11,0,Math.PI*2); ctx.fill();
  txt('EYES FIRST', ex+120, ey-190, 32, COL.hum,'center',900,FONTD, ss(3.4,4.2,lt));
  vsTag(960, 985, 'NAVIGATES BY TOUCH', 'NAVIGATES BY SIGHT', ss(5.6,6.6,lt));
}
function drawS8(t){
  const i=7, st=sStart(i), lt=t-st, dur=sDur(i);
  const endCard = ss(dur-2.5, dur-1.9, lt);
  ctx.save(); ctx.globalAlpha=1-endCard;
  figLabel('FIG. 8 — TWO PLANS','Two engineering philosophies','same problem, opposite solutions');
  ctx.strokeStyle=COL.panelEdge; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(W/2,190); ctx.lineTo(W/2,880); ctx.stroke();
  /* left: centipede assembles module by module */
  const n=12, asm=ss(0.5,4.6,lt);
  const litN=Math.floor(asm*n);
  drawCentipede({x:480, y:470, len:760, segs:15, t:t*0.5, move:0.15, legLen:46, headR:27, tailR:11,
    segGlow:(k)=> k<litN? 0.55 : -1, alpha:1});
  /* hide un-assembled tail with bg block */
  if(litN<15){ const frac=litN/15; ctx.fillStyle=COL.bg;
    ctx.fillRect(480-380+frac*760, 300, 760*(1-frac)+60, 380); }
  /* right: human assembles from blocks */
  const blocks=[['BRAIN',0.55],['SENSES',1.25],['LUNGS + BLOOD',1.95],['ONE PUMP',2.65],['SPECIALISED LIMBS',3.35]];
  blocks.forEach(([L,bt],k)=>{ const p=spring(clamp((lt-bt)/0.6,0,1.2)); if(p<=0.01) return;
    const bw=430, bh=76, bx=1440-bw/2, by=282+k*100;
    ctx.save(); ctx.globalAlpha=p; ctx.translate(1440, by+bh/2); ctx.scale(p,p); ctx.translate(-1440,-(by+bh/2));
    ctx.fillStyle='#17323c'; rr(bx,by,bw,bh,14); ctx.fill();
    ctx.strokeStyle=COL.hum; ctx.lineWidth=3; ctx.stroke();
    txt(L, 1440, by+bh/2+1, 30, COL.humSoft,'center',800,FONTD);
    ctx.restore(); });
  /* stamps */
  const tS1=wordTime(i,'centralise')-st, tS2=wordTime(i,'Theirs')-st;
  if(lt>tS2) stamp('REPEAT THE MODULE', 480, 848, 40, COL.cent, -0.05, spring(clamp((lt-tS2)/0.45,0,1.2)));
  if(lt>tS1) stamp('CENTRALISE & SPECIALISE', 1440, 848, 40, COL.hum, 0.05, spring(clamp((lt-tS1)/0.45,0,1.2)));
  const tEnd=wordTime(i,'Neither')-st;
  if(lt>tEnd) txt('Neither is a draft of the other.', W/2, 950, 44, COL.ink,'center',800,FONT, ss(tEnd,tEnd+0.6,lt));
  ctx.restore();
  /* end card */
  if(endCard>0){ ctx.save(); ctx.globalAlpha=endCard;
    ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
    txt('WHY A CENTIPEDE IS NOT', W/2, 428, 74, COL.ink,'center',900,FONTD);
    txt('A SMALL HUMAN', W/2, 512, 74, COL.cent,'center',900,FONTD);
    ctx.strokeStyle=COL.gold; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(W/2-330,586); ctx.lineTo(W/2+330,586); ctx.stroke();
    txt('filed under:  DIFFERENT PLANS', W/2, 648, 32, COL.gold,'center',700,FONTD,1,3);
    ctx.restore(); }
}
/* ================= DISPATCH ================= */
const SCENES=[drawS1,drawS2,drawS3,drawS4,drawS5,drawS6,drawS7,drawS8];
function seek(t){
  t=clamp(t,0,DUR);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,COL.bg2); bg.addColorStop(1,COL.bg);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ const a=sceneAlpha(i,t); if(a<=0.003) continue;
    ctx.save(); ctx.globalAlpha=a; SCENES[i](t); ctx.restore(); }
  drawCaption(t);
  vignette();
}
window.seek=seek;
window.DUR=DUR;
seek(0);
window.__ready=true;
