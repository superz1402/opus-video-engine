<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Caveat'; src:url(fonts/Caveat.ttf); font-weight:400 700; }
  @font-face { font-family:'Reenie Beanie'; src:url(fonts/ReenieBeanie.ttf); }
  html,body{margin:0;padding:0;background:#111;}
  canvas{display:block;}
</style>
</head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
'use strict';
/* ================================================================
   URBAN SKETCH · PEN & WASH — "WOH LADY JO NVIDIA KE ANDAR THI"
   2-minute style demo. A sketchbook page drawn on location:
   sepia fineliner first (wobble, overshoot, gaps, real stroke
   order), then loose watercolour misregistered on top, arriving
   through wet fronts. Figures boil at 12 fps; the page does not.
   All text is handwriting on the page. No real faces/photos/logos.
   Page space: 2560 x 1440. Output: 1920 x 1080 @ 24 fps.
   ================================================================ */
const TL = window.TL, B = TL.beats;
const PW = 2560, PH = 1440;
const PAPER = '#f5eede', INK = '#2b2520';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ---------- deterministic rng / noise ---------- */
function mulberry(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashN(x, y){ let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return hashN(xi, yi) * (1 - u) * (1 - v) + hashN(xi + 1, yi) * u * (1 - v) + hashN(xi, yi + 1) * (1 - u) * v + hashN(xi + 1, yi + 1) * u * v;
}
function fbm(x, y){ return vnoise(x, y) * 0.6 + vnoise(x * 2.13, y * 2.13) * 0.28 + vnoise(x * 4.7, y * 4.7) * 0.12; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, p) => a + (b - a) * p;
const sstep = p => { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); };
const easeIO = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

/* ---------- paper (baked): cream cold-press, mottling, frayed drawing edge ---------- */
function bakePaper(edge, seed){
  const c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const g = c.getContext('2d'), rnd = mulberry(seed);
  g.fillStyle = PAPER; g.fillRect(0, 0, PW, PH);
  const tones = ['#efe2c8', '#faf3e2', '#ead9ba', '#f3e9d2'];
  for (let oct = 0; oct < 2; oct++){
    const n = oct ? 300 : 130, rMin = oct ? 60 : 200, rMax = oct ? 200 : 560;
    for (let i = 0; i < n; i++){
      const x = rnd() * PW, y = rnd() * PH, r = rMin + rnd() * (rMax - rMin);
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const col = tones[(rnd() * tones.length) | 0];
      gr.addColorStop(0, col + '2e'); gr.addColorStop(1, col + '00');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
  }
  // frayed edge: white dab band inside the drawing edge, sparse colour dabs outside
  const [ex0, ey0, ex1, ey1] = edge;
  for (let i = 0; i < 260; i++){
    const side = (rnd() * 4) | 0; let x, y;
    if (side === 0){ x = ex0 + rnd() * (ex1 - ex0); y = ey0 + rnd() * 26; }
    else if (side === 1){ x = ex0 + rnd() * (ex1 - ex0); y = ey1 - rnd() * 26; }
    else if (side === 2){ x = ex0 + rnd() * 26; y = ey0 + rnd() * (ey1 - ey0); }
    else { x = ex1 - rnd() * 26; y = ey0 + rnd() * (ey1 - ey0); }
    g.fillStyle = 'rgba(250,246,235,0.5)';
    g.beginPath(); g.ellipse(x, y, 5 + rnd() * 15, 3 + rnd() * 8, rnd() * 3, 0, 7); g.fill();
  }
  for (let i = 0; i < 130; i++){
    const side = (rnd() * 4) | 0; let x, y;
    if (side === 0){ x = ex0 + rnd() * (ex1 - ex0); y = ey0 - 8 - rnd() * 46; }
    else if (side === 1){ x = ex0 + rnd() * (ex1 - ex0); y = ey1 + 8 + rnd() * 46; }
    else if (side === 2){ x = ex0 - 8 - rnd() * 46; y = ey0 + rnd() * (ey1 - ey0); }
    else { x = ex1 + 8 + rnd() * 46; y = ey0 + rnd() * (ey1 - ey0); }
    g.fillStyle = ['rgba(90,95,130,0.20)', 'rgba(140,150,170,0.18)', 'rgba(190,160,110,0.16)'][(rnd() * 3) | 0];
    g.beginPath(); g.ellipse(x, y, 4 + rnd() * 11, 3 + rnd() * 6, rnd() * 3, 0, 7); g.fill();
  }
  return c;
}
/* tooth tile, multiplied over everything (figures included) in page space */
const toothTile = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256), rnd = mulberry(99);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 222 + rnd() * 33;
    img.data[i] = v; img.data[i + 1] = v * 0.985; img.data[i + 2] = v * 0.94; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0); return c;
})();
let toothPattern = null;
function layTooth(g){
  if (!toothPattern) toothPattern = g.createPattern(toothTile, 'repeat');
  g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.5;
  g.fillStyle = toothPattern; g.fillRect(-200, -200, PW + 400, PH + 400); g.restore();
}

/* ---------- pen strokes: wobble, overshoot, gaps, real draw order ---------- */
function mkStroke(raw, o = {}){
  const seed = o.seed ?? 1, rnd = mulberry(seed * 7919 + 13);
  const wob = o.wob ?? 1.15, over = o.over ?? 5, w = o.w ?? 2.3;
  // resample at ~7 px
  const dense = [raw[0]];
  for (let i = 1; i < raw.length; i++){
    let [ax, ay] = dense[dense.length - 1]; const [bx, by] = raw[i];
    const d = Math.hypot(bx - ax, by - ay), steps = Math.max(1, Math.round(d / 7));
    for (let s = 1; s <= steps; s++) dense.push([ax + (bx - ax) * s / steps, ay + (by - ay) * s / steps]);
  }
  // overshoot both ends along the end directions
  const ext = (pts, dir) => {
    const a = pts[0], b = pts[1] || [a[0] + dir, a[1]];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
    return [a[0] + (a[0] - b[0]) / d * over, a[1] + (a[1] - b[1]) / d * over];
  };
  dense.unshift(ext(dense, 1)); dense.push(ext([...dense].reverse(), 1));
  // wobble perpendicular, smooth via 1D value noise over arclength
  const pts = []; let acc = 0;
  for (let i = 0; i < dense.length; i++){
    if (i) acc += Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]);
    const p = dense[i], q = dense[Math.min(i + 1, dense.length - 1)], m = dense[Math.max(i - 1, 0)];
    let nx = -(q[1] - m[1]), ny = (q[0] - m[0]); const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const off = (vnoise(acc * 0.018, seed * 3.7) - 0.5) * 2 * wob;
    pts.push([p[0] + nx * off, p[1] + ny * off]);
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const len = cum[cum.length - 1] || 1;
  let gap = null;
  if ((o.gapP ?? 0.45) > rnd() && len > 60){ const g0 = len * (0.25 + rnd() * 0.5); gap = [g0, g0 + 4 + rnd() * 8]; }
  return { pts, cum, len, w, gap, seed };
}
function strokePath(g, st, p){
  // path of the stroke drawn up to fraction p (gap honoured); caller strokes it
  const target = st.len * clamp(p, 0, 1);
  g.beginPath(); let pen = false;
  for (let i = 0; i < st.pts.length; i++){
    const c = st.cum[i];
    if (c > target) break;
    const inGap = st.gap && c > st.gap[0] && c < st.gap[1];
    if (inGap){ pen = false; continue; }
    if (!pen){ g.moveTo(st.pts[i][0], st.pts[i][1]); pen = true; } else g.lineTo(st.pts[i][0], st.pts[i][1]);
  }
}
function drawStroke(g, st, p, col = INK, alpha = 0.96){
  if (p <= 0) return;
  g.save(); g.strokeStyle = col; g.globalAlpha = alpha; g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = st.w * 0.62; strokePath(g, st, p); g.globalAlpha = alpha * 0.45; g.stroke();
  g.lineWidth = st.w; strokePath(g, st, p); g.globalAlpha = alpha; g.stroke();
  g.restore();
}
/* a timed stroke list: the pen draws in real order */
function drawStrokeList(g, list, t){
  for (const e of list){
    const p = (t - e.t0) / e.dur;
    if (p <= 0) continue;
    drawStroke(g, e.st, Math.min(p, 1), e.col || INK, e.alpha ?? 0.96);
  }
}
function S(raw, t0, dur, o = {}){ return { st: mkStroke(raw, o), t0, dur, col: o.col, alpha: o.alpha }; }
function rectStrokes(x, y, w, h, t0, dur, o = {}){
  const d4 = dur / 4;
  return [
    S([[x, y], [x + w, y]], t0, d4, o), S([[x + w, y], [x + w, y + h]], t0 + d4, d4, o),
    S([[x + w, y + h], [x, y + h]], t0 + 2 * d4, d4, o), S([[x, y + h], [x, y]], t0 + 3 * d4, d4, o)];
}
function arcStroke(cx, cy, r, a0, a1, t0, dur, o = {}){
  const pts = []; const n = Math.max(6, Math.round((a1 - a0) * r / 9));
  for (let i = 0; i <= n; i++){ const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return S(pts, t0, dur, o);
}
function ellipseStroke(cx, cy, rx, ry, t0, dur, o = {}){
  const pts = []; const n = 42;
  for (let i = 0; i <= n; i++){ const a = i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return S(pts, t0, dur, o);
}

/* ---------- wash: rough-edged polygons, misregistered, granulation ---------- */
function jitPoly(poly, seed, jit = 6){
  const rnd = mulberry(seed * 331 + 7); const out = [];
  for (let i = 0; i < poly.length; i++){
    const [x, y] = poly[i], [nx, ny] = poly[(i + 1) % poly.length];
    out.push([x + (rnd() - 0.5) * jit, y + (rnd() - 0.5) * jit]);
    out.push([(x + nx) / 2 + (rnd() - 0.5) * jit * 1.6, (y + ny) / 2 + (rnd() - 0.5) * jit * 1.6]);
  }
  return out;
}
function polyPath(g, poly){
  g.beginPath(); g.moveTo(poly[0][0], poly[0][1]);
  for (let i = 1; i < poly.length; i++) g.lineTo(poly[i][0], poly[i][1]);
  g.closePath();
}
/* shape: {poly, col:[r,g,b], a, dx, dy, seed, tArr, cx, cy, r, noEdge, clip:[x,y,w,h]} */
function drawWashShape(g, sh, t){
  const q = clamp((t - sh.tArr) / 0.55, 0, 1);
  if (q <= 0) return;
  const jp = jitPoly(sh.poly, sh.seed + ((q < 1) ? Math.floor(t * 12) : 0), 4);
  g.save();
  if (sh.clip){ g.beginPath(); g.rect(sh.clip[0], sh.clip[1], sh.clip[2], sh.clip[3]); g.clip(); }
  g.translate(sh.dx || 0, sh.dy || 0);
  if (q < 1){ // wet front: noisy circular clip blooming from the shape's heart + dark tide line
    const rr = sh.r * (0.25 + 0.75 * q), rnd = mulberry(sh.seed * 17 + Math.floor(t * 12));
    const circ = [];
    for (let i = 0; i <= 14; i++){
      const a = i / 14 * Math.PI * 2, rad = rr * (0.82 + rnd() * 0.36);
      circ.push([sh.cx + Math.cos(a) * rad, sh.cy + Math.sin(a) * rad * 0.8]);
    }
    g.beginPath(); circ.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.clip();
    if (!sh.noEdge){
      g.beginPath(); circ.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
      g.strokeStyle = `rgba(${sh.col[0] * 0.55 | 0},${sh.col[1] * 0.55 | 0},${sh.col[2] * 0.55 | 0},0.30)`;
      g.lineWidth = 5; g.stroke();
    }
  }
  g.globalCompositeOperation = 'multiply';
  polyPath(g, jp);
  g.fillStyle = `rgba(${sh.col[0]},${sh.col[1]},${sh.col[2]},${sh.a})`; g.fill();
  // second glaze, offset the other way, spilling a little past the line
  const jp2 = jitPoly(sh.poly, sh.seed + 31, 7);
  g.save(); g.translate(-(sh.dx || 0) * 0.8, (sh.dy || 0) * 0.6);
  polyPath(g, jp2);
  g.fillStyle = `rgba(${sh.col[0]},${sh.col[1]},${sh.col[2]},${sh.a * 0.45})`; g.fill();
  g.restore();
  g.globalCompositeOperation = 'source-over';
  if (!sh.noEdge){
    polyPath(g, jp); // dried edge: pigment pooled at the rim
    g.strokeStyle = `rgba(${sh.col[0] * 0.6 | 0},${sh.col[1] * 0.6 | 0},${sh.col[2] * 0.6 | 0},${0.34 * sh.a + 0.1})`;
    g.lineWidth = 2.2; g.stroke();
  }
  g.restore();
}
function bakeGranulation(shapes, seed){
  const c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const g = c.getContext('2d'), rnd = mulberry(seed);
  for (const sh of shapes){
    const jp = jitPoly(sh.poly, sh.seed);
    g.save(); polyPath(g, jp); g.clip();
    const xs = sh.poly.map(p => p[0]), ys = sh.poly.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    for (let i = 0; i < 200; i++){
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      const dark = rnd() > 0.42;
      g.fillStyle = dark ? `rgba(${sh.col[0] * 0.5 | 0},${sh.col[1] * 0.5 | 0},${sh.col[2] * 0.5 | 0},${0.05 + rnd() * 0.06})`
                         : `rgba(255,252,240,${0.04 + rnd() * 0.05})`;
      g.beginPath(); g.arc(x, y, 0.8 + rnd() * 2.4, 0, 7); g.fill();
    }
    g.restore();
  }
  return c;
}

/* ---------- handwriting on the page (left-to-right reveal) ---------- */
function handwrite(g, text, x, y, size, p, o = {}){
  if (p <= 0) return;
  g.save();
  g.font = `${o.weight || 500} ${size}px ${o.font || 'Caveat'}`;
  g.fillStyle = o.col || INK; g.globalAlpha = o.alpha ?? 0.94; g.textBaseline = 'alphabetic';
  if (o.rot){ g.translate(x, y); g.rotate(o.rot); x = 0; y = 0; }
  const widths = [...text].map(ch => g.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  g.beginPath(); g.rect(x - 4, y - size * 1.15, total * clamp(p, 0, 1) + 6, size * 1.5); g.clip();
  g.fillText(text, x, y);
  g.restore();
}
function textW(text, size, o = {}){
  ctx.save(); ctx.font = `${o.weight || 500} ${size}px ${o.font || 'Caveat'}`;
  const w = ctx.measureText(text).width; ctx.restore(); return w;
}
/* ================= FIGURES — ink people, faces blank (reserves), boil at 12 fps ================= */
const boil = t => Math.floor(t * 12);
function figStroke(raw, base, t, o = {}){ return mkStroke(raw, { ...o, seed: base + boil(t) * 131 }); }

/* seated figure. (x,y) = seat point; s = scale; lean toward leanDir; armTo = page point the near hand reaches to */
function seatedFigure(g, x, y, s, o, t){
  const inkP = o.inkP ?? 1, lean = o.lean ?? 0, ld = o.leanDir ?? -1;
  const bob = Math.sin(t * 0.85 + (o.phase || 0)) * 1.6;
  const shY = y - 118 * s + bob + lean * 9 * s, shW = 47 * s;
  const shL = [x - shW + lean * ld * 30 * s, shY], shR = [x + shW + lean * ld * 30 * s, shY];
  const hx = x + lean * ld * 38 * s, hy = y - 156 * s + bob + lean * 12 * s, hr = 27 * s;
  const seatL = [x - 40 * s, y], seatR = [x + 40 * s, y];
  // wash: torso / dress (paper reserve until its arrival; the lady's pink blooms via drawWashShape)
  const torsoPoly = [[shL[0], shL[1]], [shR[0], shR[1]], [seatR[0] + (o.dress ? 16 * s : 0), seatR[1]], [seatL[0] - (o.dress ? 16 * s : 0), seatL[1]]];
  if (o.cloth){
    if (o.clothBloom){
      drawWashShape(g, { poly: torsoPoly, col: o.cloth, a: o.clothA ?? 0.55, dx: 2.5, dy: 2, seed: o.seed * 3 + 5, tArr: o.clothBloom, cx: x, cy: y - 70 * s, r: 105 * s }, t);
    } else if ((o.washP ?? 1) > 0){
      g.save(); g.globalCompositeOperation = 'multiply';
      const jp = jitPoly(torsoPoly, o.seed * 3 + 5 + boil(t));
      polyPath(g, jp); g.fillStyle = `rgba(${o.cloth[0]},${o.cloth[1]},${o.cloth[2]},${(o.clothA ?? 0.45) * (o.washP ?? 1)})`; g.fill();
      // shadow side mixed toward violet
      const shPoly = [[lerp(shL[0], shR[0], 0.55), shL[1]], [shR[0], shR[1]], [seatR[0], seatR[1]], [lerp(seatL[0], seatR[0], 0.55), seatL[1]]];
      polyPath(g, jitPoly(shPoly, o.seed * 3 + 9 + boil(t)));
      g.fillStyle = `rgba(70,72,115,${0.20 * (o.washP ?? 1)})`; g.fill();
      g.restore();
    }
  }
  const bs = o.seed * 977 + (o.back ? 31 : 0);
  const strokes = [];
  const add = (raw, oo = {}) => strokes.push(figStroke(raw, bs + strokes.length * 7, t, oo));
  add([shL, [seatL[0], seatL[1] - 4]]); add([shR, [seatR[0], seatR[1] - 4]]);
  add([[shL[0], shL[1]], [(shL[0] + shR[0]) / 2, shY - 5 * s], [shR[0], shR[1]]]); // shoulders
  // head: ellipse in two arcs, face left blank
  const arc = (a0, a1, r = hr) => { const pts = []; for (let i = 0; i <= 10; i++){ const a = a0 + (a1 - a0) * i / 10; pts.push([hx + Math.cos(a) * r, hy + Math.sin(a) * r * 1.12]); } return pts; };
  add(arc(Math.PI * 0.95, Math.PI * 2.05)); add(arc(Math.PI * -0.05, Math.PI * 1.05));
  // hair mass (face knocked out of its lower part)
  const hairW = { w: 3.4 };
  add(arc(Math.PI * 1.08, Math.PI * 1.92, hr * 0.99), hairW);
  add(arc(Math.PI * 1.15, Math.PI * 1.85, hr * 0.86), hairW);
  if (o.hair === 'long'){
    add([[hx - hr * 0.92, hy - hr * 0.2], [hx - hr * 1.02, hy + 44 * s], [hx - hr * 0.8, hy + 66 * s]], hairW);
    add([[hx + hr * 0.92, hy - hr * 0.2], [hx + hr * 1.0, hy + 40 * s], [hx + hr * 0.78, hy + 62 * s]], hairW);
  }
  if (o.hair === 'bun') add(arc(Math.PI * 1.2, Math.PI * 1.8, hr * 0.45).map(p => [p[0], p[1] - hr * 0.95]), hairW);
  if (o.back){ add(arc(Math.PI * 1.02, Math.PI * 1.98, hr * 1.04), hairW); add(arc(Math.PI * 0.1, Math.PI * 0.9, hr * 1.02), hairW); }
  if (o.profile){ add([[hx + o.profile * hr * 0.95, hy + 2], [hx + o.profile * (hr + 6 * s), hy + 7 * s], [hx + o.profile * hr * 0.9, hy + 11 * s]], { w: 1.8 }); }
  // arms
  if (o.armTo){
    const sh = o.armSide === 'R' ? shR : shL;
    const mid = [(sh[0] + o.armTo[0]) / 2 + 8 * s, (sh[1] + o.armTo[1]) / 2 + 20 * s];
    add([sh, mid, o.armTo], { w: 2.6 });
    const osh = o.armSide === 'R' ? shL : shR;
    add([osh, [osh[0] + (x - osh[0]) * 0.4, shY + 52 * s], [x + (x - osh[0]) * 0.2, y - 26 * s]]);
  } else {
    // forearms resting on the table: upper arm down the torso side, forearm in toward the table
    add([shL, [shL[0] - 5 * s, shY + 60 * s], [x - 25 * s, y - 15 * s]]);
    add([shR, [shR[0] + 5 * s, shY + 60 * s], [x + 25 * s, y - 15 * s]]);
  }
  strokes.forEach((st, i) => drawStroke(g, st, clamp(inkP * 1.5 - i * 0.05, 0, 1)));
  return { head: [hx, hy], shoulderR: shR, shoulderL: shL };
}
/* standing figure. (x, baseY) = ground point */
function standingFigure(g, x, baseY, s, o, t){
  const inkP = o.inkP ?? 1, hipY = baseY - 96 * s, shY = baseY - 188 * s + Math.sin(t * 0.85 + (o.phase || 0)) * 1.4;
  const hx = x + (o.leanX || 0), hy = shY - 34 * s, hr = 25 * s;
  let footL = [x - 17 * s, baseY], footR = [x + 17 * s, baseY];
  if (o.pose === 'walk'){
    const ph = Math.sin(o.walkPh || 0);
    footL = [x - ph * 34 * s, baseY - Math.max(0, Math.cos(o.walkPh || 0)) * 7 * s];
    footR = [x + ph * 34 * s, baseY - Math.max(0, -Math.cos(o.walkPh || 0)) * 7 * s];
  }

  const kissPulse = (!cold && t > B.kiss && t < B.kiss + 1.0) ? Math.sin((t - B.kiss) / 1.0 * Math.PI) * 0.13 : 0;
  const order = phase === 1 ? [6, 7] : [0, 1, 2, 3, 4, 5];
  for (const i of order){

    const inkStart = cold ? 55.0 + i * 0.22 : 11.2 + i * 0.25;
    const inkP = clamp((t - inkStart) / 1.1, 0, 1);
    if (inkP <= 0) continue;
    const washP = clamp((t - (cold ? 55.6 : 12.3) - i * 0.18) / 1.0, 0, 1);

  if (phase === 1 && !cold && t > B.kiss && t < B.kiss + 0.9){
    const a = 0.6 * (1 - (t - B.kiss) / 0.9);
